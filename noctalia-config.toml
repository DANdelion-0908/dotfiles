[audio]
enable_sounds = true

[bar.default]
background_opacity = 0.50999998860061169
center = [ "clock", "control-center" ]
end = [
    "tray",
    "cpu",
    "temp",
    "ram",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session",
    "notifications"
]
font_family = "FiraCode Nerd Font"
font_weight = 700
icon_color = "tertiary"
margin_ends = 15
scale = 1.0500000081956387
start = [ "launcher", "wallpaper", "workspaces", "media", "audio_visualizer", "active_window" ]
widget_spacing = 25

[battery]
warning_threshold = 25

    [battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
    warning_threshold = 30

[calendar]
enabled = true

    [calendar.account.personal_google]
    color = "on_tertiary"
    name = "Daniel Penedo"
    type = "google"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "weather"

[[control_center.shortcuts]]
type = "session"

[[control_center.shortcuts]]
type = "dark_mode"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
reserve_space = false

[hot_corners]
enabled = true

    [hot_corners.bottom_right]
    action = "window_switcher"

    [hot_corners.top_left]
    action = "none"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
fingerprint = false

[lockscreen_widgets]
